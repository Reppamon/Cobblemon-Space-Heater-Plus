			enable_water_charm = true

		[Charms."Type Charms"."Grant On Advancement"]
			grant_bug_charm_on_advancement = true
			grant_dark_charm_on_advancement = true
			grant_dragon_charm_on_advancement = true
			grant_electric_charm_on_advancement = true
			grant_fairy_charm_on_advancement = true
			grant_fighting_charm_on_advancement = true
			grant_fire_charm_on_advancement = true
			grant_flying_charm_on_advancement = true
			grant_ghost_charm_on_advancement = true
			grant_grass_charm_on_advancement = true
			grant_ground_charm_on_advancement = true
			grant_ice_charm_on_advancement = true
			grant_normal_charm_on_advancement = true
			grant_poison_charm_on_advancement = true
			grant_psychic_charm_on_advancement = true
			grant_rock_charm_on_advancement = true
			grant_steel_charm_on_advancement = true
			grant_water_charm_on_advancement = true
